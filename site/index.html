<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskMaster</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    .meta { color: #666; font-size: 0.85rem; }
    li { cursor: pointer; padding: 0.25rem 0; }
    li.done { text-decoration: line-through; color: #999; }
  </style>
</head>
<body>
  <h1>TaskMaster v1</h1>
  <p class="meta">Build <code id="sha">__COMMIT_SHA__</code> &middot; <span id="time">__BUILD_TIME__</span></p>
  <input id="task" placeholder="Add a task">
  <button id="add">Add</button>
  <ul id="list"></ul>
  <script>
    var input = document.getElementById("task");
    var list = document.getElementById("list");
    document.getElementById("add").addEventListener("click", function () {
      var text = input.value.trim();
      if (text === "") { return; }
      var li = document.createElement("li");
      li.textContent = text;
      li.addEventListener("click", function () { li.classList.toggle("done"); });
      list.appendChild(li);
      input.value = "";
    });
  </script>
</body>
</html>
